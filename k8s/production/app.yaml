apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: restaurant
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: prodpassword456
  ENV: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-app
  template:
    metadata:
      labels:
        app: restaurant-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-app
  namespace: production
spec:
  selector:
    app: restaurant-app
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
---
