name: DevSecOps gate and Deploy Production
on:
  workflow_run:
    workflows: ["DevSecOps Staging Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
env:
  IMAGE_NAME: ghcr.io/biniter1/nt524_shift_left_in_cicd
  IMAGE_TAG: latest
jobs:
  gate:
    name: "Production gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Gate check 1 - verify image signature
        id: check-signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/biniter1/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "[OK] Signature verified"
      - name: Gate check 2 - verify SBOM attestation
        id: check-sbom
        run: |
            COUNT=$(cosign tree ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} 2>/dev/null \
              | grep -c "Attestations" || echo "0")
            if [[ "${COUNT}" -gt 0 ]]; then
              echo "✅ SBOM attestation exists"
            else
              echo "❌ No SBOM attestation found"
              exit 1
            fi
      - name: Gate check 3 - OPA simulation
        id: check-opa
        run: |
          echo "🛡️ Running OPA Gatekeeper policy checks (simulated)..."
          echo ""

          VIOLATIONS=0

          # Policy 1: Image phải từ đúng registry
          REGISTRY="ghcr.io/biniter1"
          if [[ "${{ env.IMAGE_NAME }}" == ${REGISTRY}* ]]; then
            echo "  ✅ P1: Image registry — ghcr.io/biniter1 (approved)"
          else
            echo "  ❌ P1: Image registry — not from approved registry"
            ((VIOLATIONS++))
          fi

          # Policy 2: Image phải có tag (không phải empty)
          if [[ -n "${{ env.IMAGE_TAG }}" ]]; then
            echo "  ✅ P2: Image tag — present (${{ env.IMAGE_TAG }})"
          else
            echo "  ❌ P2: Image tag — missing"
            ((VIOLATIONS++))
          fi

          # Policy 3: Signature phải đã được verify (từ check trước)
          if [[ "${{ steps.check-signature.outcome }}" == "success" ]]; then
            echo "  ✅ P3: Image signature — verified by Cosign OIDC"
          else
            echo "  ❌ P3: Image signature — not verified"
            ((VIOLATIONS++))
          fi

          # Policy 4: SBOM attestation phải có (từ check trước)
          if [[ "${{ steps.check-sbom.outcome }}" == "success" ]]; then
            echo "  ✅ P4: SBOM attestation — present and verified"
          else
            echo "  ❌ P4: SBOM attestation — missing or invalid"
            ((VIOLATIONS++))
          fi

          # Policy 5: Runtime policies (simulate)
          echo "  ✅ P5: Runtime policies — non-root user enforced"
          echo "  ✅ P6: Runtime policies — no privileged containers"
          echo "  ✅ P7: Runtime policies — drop ALL capabilities"
          echo "  ✅ P8: Runtime policies — read-only root filesystem"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "OPA Gate Result: ${VIOLATIONS} violation(s)"

          if [[ "${VIOLATIONS}" -gt 0 ]]; then
            echo "❌ Gate FAILED — ${VIOLATIONS} policy violation(s)"
            exit 1
          fi

          echo "✅ All policies passed — cleared for production"
      # GATE 4 Trivy scan image
      - name: Verify Trivy scan
        id: trivy
        uses: aquasecurtiy/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG}}
          format: 'table'
          severity: HIGH,CRITICAL
          exit-code: '1'
      # GATE 5 Verify K8S config
      - name: Verify K8S config
        id: k8s-config
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: k8s/production

      - name: Gate summary
        if: always()
        run: |
          echo "## 🛡️ Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Signature | ${{ steps.check-signature.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Attestation | ${{ steps.check-sbom.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OPA Policy Checks | ${{ steps.check-opa.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ steps.trivy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| K8S Config | ${{ steps.k8s-config.outcome }} |" >> $GITHUB_STEP_SUMMARY
  production:
    name: "Production Deploy"
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy k8s production manifest
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/k8s-production"
          scp -i ~/.ssh/ec2_key.pem -r k8s/production/*.yaml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s-production/

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << ENDSSH
            set -e
            export HOME=/home/ubuntu
            echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

            docker rmi  ghcr.io/biniter1/nt524_shift_left_in_cicd:latest || true
            docker pull --platform linux/amd64 ghcr.io/biniter1/nt524_shift_left_in_cicd:latest
            docker save ghcr.io/biniter1/nt524_shift_left_in_cicd:latest -o /tmp/app-image.tar
            docker cp /tmp/app-image.tar staging-control-plane:/image.tar
            docker exec staging-control-plane ctr --namespace=k8s.io images import /image.tar
            rm -f /tmp/app-image.tar
            docker exec staging-control-plane rm -f /image.tar
            sed -i "s|IMAGE_PLACEHOLDER|ghcr.io/biniter1/nt524_shift_left_in_cicd:latest|g" \
              /home/ubuntu/k8s-production/app.yaml
            kubectl delete namespace production --ignore-not-found=true
            sleep 5
            kubectl apply -f /home/ubuntu/k8s-production/namespace.yaml
            kubectl apply -f /home/ubuntu/k8s-production/postgres.yaml
            kubectl apply -f /home/ubuntu/k8s-production/app.yaml
            kubectl rollout status deployment/postgres -n production --timeout=120s
            kubectl rollout status deployment/restaurant-app -n production --timeout=180s
          ENDSSH
      - name: Falco monitorting
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            if command -v falco >/dev/null 2>&1; then
              sudo systemctl status falco --no-pager | head -5 || true
            else
              curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | \
                sudo gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] \
                https://download.falco.org/packages/deb stable main" | \
                sudo tee /etc/apt/sources.list.d/falcosecurity.list
              sudo apt-get update -qq
              sudo apt-get install -y falco
              echo "✅ Falco installed"
            fi
            sudo falco --list 2>/dev/null | grep "rule:" | head -10 || \
              echo "  (Falco rules available after service start)"

          ENDSSH
      - name: Production smoke test
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            nohup kubectl port-forward svc/restaurant-app 18001:8000 \
              -n production > /tmp/pf-prod.log 2>&1 &

            # Retry 12 lần, mỗi lần cách 5s = 60s total
            for i in $(seq 1 12); do
              echo "Attempt ${i}/12..."
              if curl -sf http://localhost:18001/docs > /dev/null; then
                echo "[OK] Production app healthy"
                break
              fi
              if [[ $i -eq 12 ]]; then
                echo "[ERROR] Production app unhealthy after 60s"
                cat /tmp/pf-prod.log
                exit 1
              fi
              sleep 5
            done

            pkill -f "kubectl port-forward.*18001" || true
          ENDSSH

      - name: Deploy summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gate passed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Image deployed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Falco monitoring | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke test | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** production" >> $GITHUB_STEP_SUMMARY
