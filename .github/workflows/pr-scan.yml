# ============================================================
# PR Scan Workflow
# Mindset: Scanner tạo evidence → Gate quyết định pass/fail
# Trigger: Pull Request vào nhánh develop
# ============================================================

name: PR Scan

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:

  # ============================================================
  # JOB 1: SAST — Semgrep
  # Mục tiêu: scan code, xuất report, KHÔNG fail workflow
  # ============================================================
  sast_scan:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch develop branch (baseline)
        run: git fetch origin develop

      - name: Setup Python & install Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Semgrep — xuất JSON report
        # Semgrep exit 1 khi có finding → dùng || true để job không fail
        # Dùng git merge-base để lấy common ancestor chính xác của PR với develop
        run: |
          pip install semgrep --quiet
          mkdir -p reports

          # merge-base cho đúng nghĩa "chỉ scan những gì PR thêm vào"
          BASELINE_COMMIT=$(git merge-base origin/develop HEAD)
          echo "Baseline commit: $BASELINE_COMMIT"

          semgrep \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --baseline-commit "$BASELINE_COMMIT" \
            --json \
            --output reports/semgrep.json \
            . \
            || true

          # Nếu semgrep không tạo file (ví dụ không có diff), tạo report rỗng
          if [ ! -f reports/semgrep.json ]; then
            echo '{"results":[],"errors":[],"paths":{}}' > reports/semgrep.json
            echo "semgrep_skipped=true" >> $GITHUB_ENV
          fi

          echo "Semgrep report:"
          cat reports/semgrep.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'  Total findings : {len(d.get(\"results\", []))}')
          print(f'  Errors         : {len(d.get(\"errors\", []))}')
          " || true

      - name: Upload artifact — semgrep-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep.json
          retention-days: 30


  # ============================================================
  # JOB 2: Secret Scan — Gitleaks
  # Mục tiêu: phát hiện secret bị commit, xuất report JSON
  # ============================================================
  secret_scan:
    name: "Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch develop branch
        run: git fetch origin develop

      - name: Run Gitleaks — scan diff PR (Docker)
        run: |
          mkdir -p reports

          # Dùng Docker để tránh vấn đề tên binary thay đổi theo version/OS
          # --log-opts scan đúng commit range của PR so với develop
          # exit code 1 = found secrets → || true để job không fail
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
              --source=/repo \
              --log-opts="origin/develop...HEAD" \
              --report-format=json \
              --report-path=/repo/reports/gitleaks.json \
            || true

          # Gitleaks không tạo file nếu không có finding → tạo list rỗng
          if [ ! -f reports/gitleaks.json ]; then
            echo '[]' > reports/gitleaks.json
          fi

          SECRET_COUNT=$(python3 -c "
          import json
          data = json.load(open('reports/gitleaks.json'))
          if isinstance(data, list):
              print(len(data))
          elif isinstance(data, dict):
              print(len(data.get('leaks', [])))
          else:
              print(0)
          " || echo 0)

          echo "Secrets found: $SECRET_COUNT"

      - name: Upload artifact — secret-scan-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: reports/gitleaks.json
          retention-days: 30


  # ============================================================
  # JOB 3: Dependency Scan — pip-audit
  # Gộp dependency-scan và library-scan thành 1 job duy nhất
  # Mục tiêu: kiểm tra CVE trong dependencies, xuất JSON
  # ============================================================
  dependency_scan:
    name: "Dependency Scan (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tools
        run: pip install poetry==1.8.3 pip-audit --quiet

      - name: Export requirements từ Poetry
        run: |
          mkdir -p reports

          # Thử export từ poetry trước
          if [ -f pyproject.toml ]; then
            poetry export \
              -f requirements.txt \
              --output reports/requirements.txt \
              --without-hashes \
              --only main \
              || true
          fi

          # Fallback: dùng requirements.txt gốc nếu có
          if [ ! -s reports/requirements.txt ] && [ -f requirements.txt ]; then
            cp requirements.txt reports/requirements.txt
          fi

          # Nếu vẫn không có file requirements → skipped hợp lệ
          if [ ! -s reports/requirements.txt ]; then
            echo "No requirements file found — creating empty report"
            echo '{"dependencies":[],"_skipped":true}' > reports/pip-audit.json
          fi

      - name: Run pip-audit
        run: |
          if [ -f reports/pip-audit.json ]; then
            # Đã tạo empty report ở bước trước (skipped)
            echo "Skipping pip-audit — no requirements"
          else
            pip-audit \
              -r reports/requirements.txt \
              --format json \
              --output reports/pip-audit.json \
              || true

            # Nếu pip-audit không tạo file vì lý do khác
            if [ ! -f reports/pip-audit.json ]; then
              echo '{"dependencies":[]}' > reports/pip-audit.json
            fi
          fi

          python3 -c "
          import json
          data = json.load(open('reports/pip-audit.json'))
          deps = data if isinstance(data, list) else data.get('dependencies', [])
          total = sum(len(d.get('vulns', [])) for d in deps)
          print(f'Vulnerabilities found: {total}')
          " || true

      - name: Upload artifact — dependency-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/pip-audit.json
          retention-days: 30


  # ============================================================
  # JOB 4: IaC/Config Scan — Checkov
  # Scan toàn bộ repo (ổn định hơn diff-only với Checkov)
  # Xuất JSON để gate parse dễ hơn SARIF
  # ============================================================
  iac_config_scan:
    name: "IaC/Config Scan (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python & install Checkov
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov --quiet

      - name: Detect config/IaC files
        id: detect
        run: |
          # Tìm các file IaC/config trong repo
          FILES=$(find . \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            \( \
              -name "*.tf" \
              -o -name "*.tfvars" \
              -o \( -name "*.yml" -o -name "*.yaml" \) \
              -o -name "Dockerfile" \
            \) \
            2>/dev/null | head -100 || true)

          if [ -n "$FILES" ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "Found $(echo "$FILES" | wc -l) config file(s)"
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No IaC/config files found"
          fi

      - name: Run Checkov — scan toàn bộ repo
        run: |
          mkdir -p reports

          if [ "${{ steps.detect.outputs.has_files }}" == "true" ]; then
            # Scan toàn bộ thư mục, xuất JSON một lần duy nhất
            # --soft-fail để checkov không exit 1 → dùng || true cho chắc
            checkov \
              --directory . \
              --output json \
              --output-file-path reports/ \
              --soft-fail \
              --quiet \
              || true

            # Checkov tạo file results_json.json trong output-file-path
            if [ -f reports/results_json.json ]; then
              mv reports/results_json.json reports/checkov.json
            else
              echo '{"results":{"passed_checks":[],"failed_checks":[]},"_note":"no output generated"}' \
                > reports/checkov.json
            fi
          else
            # Không có file để scan → tạo marker rỗng
            echo '{"results":{"passed_checks":[],"failed_checks":[]},"_skipped":true}' \
              > reports/checkov.json
          fi

          python3 -c "
          import json
          data = json.load(open('reports/checkov.json'))
          results = data.get('results', {})
          passed = len(results.get('passed_checks', []))
          failed = len(results.get('failed_checks', []))
          print(f'Checkov — passed: {passed}, failed: {failed}')
          " || true

      - name: Upload artifact — checkov-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: reports/checkov.json
          retention-days: 30


  # ============================================================
  # JOB 5: Gate — Tổng hợp findings, quyết định Block/Allow
  # Đây là nơi DUY NHẤT được phép exit 1
  # ============================================================
  gate:
    name: "Gate — Block or Allow Merge"
    runs-on: ubuntu-latest
    needs: [sast_scan, secret_scan, dependency_scan, iac_config_scan]
    if: always()   # Luôn chạy dù scan job có fail
    steps:
      - name: Download tất cả scan artifacts
        uses: actions/download-artifact@v4
        with:
          # Download tất cả artifact của workflow này
          path: ./artifacts
        continue-on-error: true

      - name: Parse reports & quyết định Gate
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import sys

          # ── Helper ──────────────────────────────────────────
          def load_json(path):
              """Load JSON, trả về None nếu file không tồn tại hoặc parse lỗi."""
              if not os.path.exists(path):
                  return None
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception as e:
                  print(f"[WARN] Cannot parse {path}: {e}")
                  return None

          def write(line=""):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def as_list(value):
              return value if isinstance(value, list) else []

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          artifacts_dir = "./artifacts"

          # ── Đường dẫn các report ────────────────────────────
          semgrep_path   = f"{artifacts_dir}/semgrep-report/semgrep.json"
          gitleaks_path  = f"{artifacts_dir}/secret-scan-report/gitleaks.json"
          pip_audit_path = f"{artifacts_dir}/dependency-report/pip-audit.json"
          checkov_path   = f"{artifacts_dir}/checkov-report/checkov.json"

          # ── Parse Semgrep ───────────────────────────────────
          semgrep_data     = load_json(semgrep_path)
          semgrep_missing  = semgrep_data is None
          semgrep_total    = 0
          semgrep_errors   = 0
          semgrep_warnings = 0
          semgrep_results  = []

          if isinstance(semgrep_data, dict):
              semgrep_results = as_list(semgrep_data.get("results", []))
              semgrep_total = len(semgrep_results)

              for r in semgrep_results:
                  if not isinstance(r, dict):
                      continue
                  extra = as_dict(r.get("extra", {}))
                  sev = str(extra.get("severity", "")).upper()
                  if sev in ("ERROR", "HIGH"):
                      semgrep_errors += 1
                  elif sev in ("WARNING", "WARN", "MEDIUM"):
                      semgrep_warnings += 1

          # ── Parse Gitleaks ──────────────────────────────────
          gitleaks_data    = load_json(gitleaks_path)
          gitleaks_missing = gitleaks_data is None
          secret_count     = 0
          leaks            = []

          if isinstance(gitleaks_data, list):
              leaks = [x for x in gitleaks_data if isinstance(x, dict)]
          elif isinstance(gitleaks_data, dict):
              raw_leaks = gitleaks_data.get("leaks", [])
              leaks = [x for x in as_list(raw_leaks) if isinstance(x, dict)]

          secret_count = len(leaks)

          # ── Parse pip-audit ─────────────────────────────────
          pip_data       = load_json(pip_audit_path)
          pip_missing    = pip_data is None
          pip_skipped    = isinstance(pip_data, dict) and pip_data.get("_skipped")
          pip_vuln_total = 0
          pip_vuln_pkgs  = []
          pip_deps       = []

          if pip_data and not pip_skipped:
              if isinstance(pip_data, list):
                  pip_deps = pip_data
              elif isinstance(pip_data, dict):
                  deps_value = pip_data.get("dependencies", [])
                  pip_deps = deps_value if isinstance(deps_value, list) else []
              else:
                  pip_deps = []

              for dep in pip_deps:
                  if not isinstance(dep, dict):
                      continue

                  vulns = dep.get("vulns", [])
                  if not isinstance(vulns, list):
                      vulns = []

                  if vulns:
                      name = dep.get("name", "?")
                      version = dep.get("version", "?")
                      pip_vuln_total += len(vulns)
                      pip_vuln_pkgs.append({
                          "name": name,
                          "version": version,
                          "vulns": [v for v in vulns if isinstance(v, dict)]
                      })

          # ── Parse Checkov ───────────────────────────────────
          checkov_data     = load_json(checkov_path)
          checkov_missing  = checkov_data is None
          checkov_skipped  = isinstance(checkov_data, dict) and checkov_data.get("_skipped")
          checkov_failed   = 0
          checkov_passed   = 0
          failed_checks    = []

          def collect_checkov(obj):
              passed = []
              failed = []

              if isinstance(obj, dict):
                  results = obj.get("results", {})

                  if isinstance(results, dict):
                      passed_items = results.get("passed_checks", [])
                      failed_items = results.get("failed_checks", [])

                      if isinstance(passed_items, list):
                          passed.extend([x for x in passed_items if isinstance(x, dict)])
                      if isinstance(failed_items, list):
                          failed.extend([x for x in failed_items if isinstance(x, dict)])

                  elif isinstance(results, list):
                      for item in results:
                          p, f = collect_checkov(item)
                          passed.extend(p)
                          failed.extend(f)

              elif isinstance(obj, list):
                  for item in obj:
                      p, f = collect_checkov(item)
                      passed.extend(p)
                      failed.extend(f)

              return passed, failed

          if checkov_data and not checkov_skipped:
              passed_checks, failed_checks = collect_checkov(checkov_data)
              checkov_passed = len(passed_checks)
              checkov_failed = len(failed_checks)

          # ── Job results từ env ──────────────────────────────
          job_results = {
              "sast_scan"       : os.environ.get("SAST_RESULT", "unknown"),
              "secret_scan"     : os.environ.get("SECRET_RESULT", "unknown"),
              "dependency_scan" : os.environ.get("DEP_RESULT", "unknown"),
              "iac_config_scan" : os.environ.get("IAC_RESULT", "unknown"),
          }

          # ── Gate Policy ─────────────────────────────────────
          CHECKOV_BLOCK_THRESHOLD = 5
          block_reasons = []

          if semgrep_missing:
              block_reasons.append("Semgrep report không tồn tại — scanner có thể bị lỗi")
          elif semgrep_errors > 0:
              block_reasons.append(f"Semgrep phát hiện {semgrep_errors} finding mức ERROR/HIGH")

          if gitleaks_missing:
              block_reasons.append("Gitleaks report không tồn tại — scanner có thể bị lỗi")
          elif secret_count > 0:
              block_reasons.append(f"Phát hiện {secret_count} secret bị lộ")

          if pip_missing:
              block_reasons.append("pip-audit report không tồn tại — scanner có thể bị lỗi")
          elif pip_vuln_total > 0:
              block_reasons.append(f"pip-audit phát hiện {pip_vuln_total} vulnerability")

          if checkov_missing:
              block_reasons.append("Checkov report không tồn tại — scanner có thể bị lỗi")
          elif checkov_failed >= CHECKOV_BLOCK_THRESHOLD:
              block_reasons.append(
                  f"Checkov có {checkov_failed} failed checks "
                  f"(vượt threshold {CHECKOV_BLOCK_THRESHOLD})"
              )

          should_block = len(block_reasons) > 0

          # ── Ghi GitHub Step Summary ─────────────────────────
          write("# 🔍 PR Scan — Gate Report")
          write()

          write("## Job Status")
          write()
          write("| Job | Runner Result |")
          write("|-----|--------------|")

          job_labels = {
              "sast_scan"       : "SAST (Semgrep)",
              "secret_scan"     : "Secret Scan (Gitleaks)",
              "dependency_scan" : "Dependency Scan (pip-audit)",
              "iac_config_scan" : "IaC/Config Scan (Checkov)",
          }

          for key, label in job_labels.items():
              r = job_results[key]
              if r == "success":
                  icon = "✅"
              elif r == "skipped":
                  icon = "⚠️"
              else:
                  icon = "❌"
              write(f"| {label} | {icon} {r} |")

          write()
          write("## Findings")
          write()

          # ── Semgrep summary ─────────────────────────────────
          write("### 🔎 SAST — Semgrep")
          if semgrep_missing:
              write("> ⚠️ Report không tìm thấy")
          else:
              write(f"- Tổng findings : **{semgrep_total}**")
              write(f"- Mức ERROR/HIGH: **{semgrep_errors}** ← block trigger")
              write(f"- Mức WARNING/MEDIUM: **{semgrep_warnings}**")

              if semgrep_results:
                  write("")
                  write("<details><summary>Top findings (tối đa 5)</summary>")
                  write("")
                  write("| Severity | Rule | File | Message |")
                  write("|----------|------|------|---------|")

                  for r in semgrep_results[:5]:
                      if not isinstance(r, dict):
                          continue
                      extra = as_dict(r.get("extra", {}))
                      sev  = extra.get("severity", "?")
                      rule = str(r.get("check_id", "?")).split(".")[-1]
                      path = r.get("path", "?")
                      line = as_dict(r.get("start", {})).get("line", "")
                      msg  = str(extra.get("message", ""))[:80]
                      loc  = f"{path}:{line}" if line else path
                      write(f"| `{sev}` | `{rule}` | `{loc}` | {msg} |")

                  write("")
                  write("</details>")
          write()

          # ── Gitleaks summary ────────────────────────────────
          write("### 🔑 Secret Scan — Gitleaks")
          if gitleaks_missing:
              write("> ⚠️ Report không tìm thấy")
          else:
              write(f"- Secrets phát hiện : **{secret_count}**")

              if leaks:
                  write("")
                  write("<details><summary>Top secrets (tối đa 5, không hiện giá trị secret)</summary>")
                  write("")
                  write("| Rule | File | Line | Commit |")
                  write("|------|------|------|--------|")

                  for leak in leaks[:5]:
                      rule   = leak.get("RuleID", leak.get("rule", "?"))
                      fpath  = leak.get("File", leak.get("file", "?"))
                      lineno = leak.get("StartLine", leak.get("line", "?"))
                      commit = str(leak.get("Commit", leak.get("commit", "?")))[:8]
                      write(f"| `{rule}` | `{fpath}` | {lineno} | `{commit}` |")

                  write("")
                  write("</details>")
          write()

          # ── pip-audit summary ───────────────────────────────
          write("### 📦 Dependency Scan — pip-audit")
          if pip_missing:
              write("> ⚠️ Report không tìm thấy")
          elif pip_skipped:
              write("> ℹ️ Skipped — không có requirements file")
          else:
              write(f"- Vulnerabilities : **{pip_vuln_total}**")

              if pip_vuln_pkgs:
                  write("- Packages bị ảnh hưởng:")
                  for dep in pip_vuln_pkgs:
                      write(f"  - `{dep['name']}=={dep['version']} ({len(dep['vulns'])} CVE)`")

                  write("")
                  write("<details><summary>Chi tiết CVE (tối đa 5 package)</summary>")
                  write("")

                  for dep in pip_vuln_pkgs[:5]:
                      write(f"**`{dep['name']}=={dep['version']}`**")
                      for v in dep["vulns"][:3]:
                          vid = v.get("id", "?")
                          desc = str(v.get("description", v.get("fix_versions", "")))[:100]
                          write(f"- `{vid}`: {desc}")
                      write("")

                  write("</details>")
          write()

          # ── Checkov summary ─────────────────────────────────
          write("### 🏗️ IaC/Config Scan — Checkov")
          if checkov_missing:
              write("> ⚠️ Report không tìm thấy")
          elif checkov_skipped:
              write("> ℹ️ Skipped — không có file IaC/config")
          else:
              write(f"- Passed checks : **{checkov_passed}**")
              write(f"- Failed checks : **{checkov_failed}** "
                    f"(block threshold: {CHECKOV_BLOCK_THRESHOLD})")

              if failed_checks:
                  write("")
                  write("<details><summary>Top failed checks (tối đa 5)</summary>")
                  write("")
                  write("| Check ID | Check Name | File | Lines |")
                  write("|----------|------------|------|-------|")

                  for c in failed_checks[:5]:
                      cid   = c.get("check_id", "?")
                      cname = str(c.get("check_name", "?"))[:60]
                      fpath = c.get("file_path", "?")
                      lines = c.get("file_line_range", ["?", "?"])
                      lines_str = f"{lines[0]}-{lines[1]}" if isinstance(lines, list) and len(lines) >= 2 else str(lines)
                      write(f"| `{cid}` | {cname} | `{fpath}` | {lines_str} |")

                  write("")
                  write("</details>")
          write()

          # ── Kết luận Gate ───────────────────────────────────
          write("---")
          write()

          if should_block:
              write("## ❌ Block Merge")
              write()
              write("Lý do block:")
              for reason in block_reasons:
                  write(f"- {reason}")
              write()
              write("> *Điều chỉnh policy tại biến `CHECKOV_BLOCK_THRESHOLD` trong gate script.*")
          else:
              write("## ✅ Allow Merge")
              write()
              write("Tất cả scanner hoàn thành, không có finding vượt policy.")

          write()
          write("---")
          write("*Artifacts được lưu 30 ngày để dùng làm audit evidence.*")

          # ── Exit code ───────────────────────────────────────
          if should_block:
              print("\n❌ GATE: Block Merge")
              for r in block_reasons:
                  print(f"  - {r}")
              sys.exit(1)
          else:
              print("\n✅ GATE: Allow Merge")
              sys.exit(0)

          PYTHON_SCRIPT

        env:
          SAST_RESULT:   ${{ needs.sast_scan.result }}
          SECRET_RESULT: ${{ needs.secret_scan.result }}
          DEP_RESULT:    ${{ needs.dependency_scan.result }}
          IAC_RESULT:    ${{ needs.iac_config_scan.result }}
