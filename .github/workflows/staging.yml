name: DevSecOps Staging Pipeline
on:
  workflow_run:
    workflows: ["DevSecOps Build Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/biniter1/nt524_shift_left_in_cicd
  IMAGE_TAG: "latest"
jobs:
  staging:
    name: "🚀 Staging Deploy & DAST"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: read
      id-token: write
      issues: write      # tạo GitHub Issue khi có finding

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/biniter1/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/ec2_key.pem
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Install cosign on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{secrets.EC2_HOST}} << ENDSSH
            set -e
            if ! command -v cosign >/dev/null 2>&1; then
              curl -O -L https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
              chmod +x cosign-linux-amd64
              sudo mv cosign-linux-amd64 /usr/local/bin/cosign
            else
              cosign version
            fi
          ENDSSH
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{secrets.EC2_HOST}} << ENDSSH
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

            docker pull ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}

            cosign verify \
              --certificate-identity-regexp "https://github.com/biniter1/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            kind load docker-image \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --name staging

            sed -i "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
                /home/ubuntu/k8s-staging/app.yaml

            kubectl delete namespace staging --ignore-not-found=true
            sleep 5

            kubectl apply -f /home/ubuntu/k8s-staging/namespace.yaml
            kubectl apply -f /home/ubuntu/k8s-staging/postgres.yaml
            kubectl apply -f /home/ubuntu/k8s-staging/app.yaml

            kubectl rollout status deployment/postgres -n staging --timeout=120s
            kubectl rollout status deployment/restaurant-app -n staging --timeout=180s
          ENDSSH
      - name: Port forward for ZAP
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -L 8000:localhost:18000 \
            -N -f \
            ubuntu@${{secrets.EC2_HOST}}

          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "nohup kubectl port-forward svc/restaurant-app 18000:8000 \
             -n staging --address 0.0.0.0 > /tmp/pf.log 2>&1 &"


          sleep 10

          curl -f http://localhost:8000/docs \
            && echo "Tunnel ok" \
            || (echo "Tunnel fail")
      - name: Run ZAP
        id: zap
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: '-a'
          fail_action: false
          artifact_name: zap_report
        continue-on-error: true
      - name: Parse ZAP report
        id: zap-parse
        if: always()
        run: |
          if [ -f "report_json.json" ];then
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' report_json.json)
            LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' report_json.json)
          else
            HIGH=0
            MEDIUM=0
            LOW=0
          fi
          echo "high=${HIGH}">> $GITHUB_OUTPUT
          echo "medium=${MEDIUM}">> $GITHUB_OUTPUT
          echo "low=${LOW}">> $GITHUB_OUTPUT

      - name: Create GitHub Issue for HIGH findings
        if: steps.zap-parse.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            const high   = '${{ steps.zap-parse.outputs.high }}';
            const medium = '${{ steps.zap-parse.outputs.medium }}';
            const low    = '${{ steps.zap-parse.outputs.low }}';
            const sha    = '${{ env.IMAGE_TAG }}'.substring(0, 7);
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[DAST] 🔴 ${high} HIGH findings on staging — ${sha}`,
              body: [
                '## 🚨 DAST Security Findings',
                '',
                '| Severity | Count |',
                '|----------|-------|',
                `| 🔴 High   | ${high}   |`,
                `| 🟡 Medium | ${medium} |`,
                `| 🟢 Low    | ${low}    |`,
                '',
                `- **Commit:** \`${sha}\``,
                `- **Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\``,
                `- **Pipeline:** [View logs](${runUrl})`,
                '',
                '## Remediation',
                '1. Download artifact `zap-report` từ pipeline run',
                '2. Review từng HIGH finding',
                '3. Fix trong code → tạo PR mới',
                '',
                '> Auto-generated by DevSecOps Pipeline'
              ].join('\n'),
              labels: ['security', 'dast', 'high-severity']
            });

      # --------------------------------------------------------
      # BƯỚC 8: Staging Gate
      # --------------------------------------------------------
      - name: Staging gate
        run: |
          HIGH=${{ steps.zap-parse.outputs.high }}
          if [[ "${HIGH}" -gt 0 ]]; then
            echo "❌ ${HIGH} HIGH findings. Blocking promotion."
            exit 1
          fi
          echo "✅ Staging gate passed."

      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          # Kill port-forward trên EC2
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "pkill -f 'kubectl port-forward' || true"

          # Xóa namespace staging
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "kubectl delete namespace staging --ignore-not-found=true"

          # Kill SSH tunnel local
          pkill -f "ssh.*18000" || true
