name: DevSecOps Staging Pipeline

on:
  workflow_run:
    workflows: ["DevSecOps Build Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/biniter1/nt524_shift_left_in_cicd
  IMAGE_TAG: latest

jobs:
  staging:
    name: "🚀 Staging Deploy & DAST"
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Trviy scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG}}
          format: 'table'
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Verify K8S config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: k8s/staging
          exit-code: '0'


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/biniter1/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "✅ Image signature verified"

      # --------------------------------------------------------
      # BƯỚC 2: Setup SSH
      # --------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # BƯỚC 3: Deploy lên kind cluster trên EC2
      # --------------------------------------------------------
      - name: Copy k8s manifests lên EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem -r k8s/staging/ \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s-staging/

      - name: Deploy lên kind cluster
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Xóa image cũ, pull fresh
            docker rmi ghcr.io/biniter1/nt524_shift_left_in_cicd:latest || true
            docker pull --platform linux/amd64 \
              ghcr.io/biniter1/nt524_shift_left_in_cicd:latest

            # Save thành tar
            docker save ghcr.io/biniter1/nt524_shift_left_in_cicd:latest \
              -o /tmp/app-image.tar

            # Copy vào kind control-plane container
            docker cp /tmp/app-image.tar staging-control-plane:/image.tar

            # Import trực tiếp vào containerd
            docker exec staging-control-plane \
              ctr --namespace=k8s.io images import /image.tar

            # Cleanup tar
            rm -f /tmp/app-image.tar
            docker exec staging-control-plane rm -f /image.tar

            echo "✅ Image loaded into kind cluster"

            # Thay IMAGE_PLACEHOLDER
            sed -i "s|IMAGE_PLACEHOLDER|ghcr.io/biniter1/nt524_shift_left_in_cicd:latest|g" \
              /home/ubuntu/k8s-staging/app.yaml
            kind export kubeconfig --name staging
            # Cleanup namespace cũ
            kubectl delete namespace staging --ignore-not-found=true
            sleep 5

            # Apply manifests
            kubectl apply -f /home/ubuntu/k8s-staging/namespace.yaml
            kubectl apply -f /home/ubuntu/k8s-staging/postgres.yaml
            kubectl apply -f /home/ubuntu/k8s-staging/app.yaml

            # Wait ready
            kubectl rollout status deployment/postgres \
              -n staging --timeout=120s
            kubectl rollout status deployment/restaurant-app \
              -n staging --timeout=180s

            echo "✅ App deployed to kind cluster"
          ENDSSH

      # --------------------------------------------------------
      # BƯỚC 4: Port-forward qua SSH tunnel
      # Expose app từ kind cluster ra EC2 public IP
      # Runner SSH tunnel → EC2:8000 → kind pod:8000
      # --------------------------------------------------------
      - name: Setup SSH tunnel + port-forward
        run: |
          # Mở SSH tunnel: localhost:8000 (runner) → EC2:18000
          # Đồng thời trên EC2: kubectl port-forward → kind pod
          ssh -i ~/.ssh/ec2_key.pem \
            -L 8000:localhost:18000 \
            -N -f \
            ubuntu@${{ secrets.EC2_HOST }}

          # Trên EC2: kubectl port-forward bind ra 0.0.0.0:18000
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "nohup kubectl port-forward svc/restaurant-app 18000:8000 \
             -n staging --address 0.0.0.0 > /tmp/pf.log 2>&1 &"

          # Đợi tunnel sẵn sàng
          sleep 10

          # Smoke test qua tunnel
          curl -f http://localhost:8000/docs \
            && echo "✅ Tunnel ready" \
            || (echo "❌ Tunnel failed" && cat /tmp/pf.log && exit 1)

      # --------------------------------------------------------
      # BƯỚC 5: OWASP ZAP DAST — scan qua tunnel
      # --------------------------------------------------------
      - name: Run OWASP ZAP baseline scan
        id: zap
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
          artifact_name: zap_report
        continue-on-error: true

      # --------------------------------------------------------
      # BƯỚC 6: Parse ZAP results
      # --------------------------------------------------------
      - name: Parse ZAP report
        id: zap-parse
        if: always()
        run: |
          if [ -f "report_json.json" ]; then
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' report_json.json)
            LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' report_json.json)
          else
            HIGH=0; MEDIUM=0; LOW=0
          fi
          echo "high=${HIGH}" >> $GITHUB_OUTPUT
          echo "medium=${MEDIUM}" >> $GITHUB_OUTPUT
          echo "low=${LOW}" >> $GITHUB_OUTPUT
          echo "ZAP — High: ${HIGH}, Medium: ${MEDIUM}, Low: ${LOW}"

      # --------------------------------------------------------
      # BƯỚC 7: Tạo GitHub Issue nếu có HIGH finding
      # --------------------------------------------------------
      - name: Create GitHub Issue for HIGH findings
        if: steps.zap-parse.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            const high   = '${{ steps.zap-parse.outputs.high }}';
            const medium = '${{ steps.zap-parse.outputs.medium }}';
            const low    = '${{ steps.zap-parse.outputs.low }}';
            const sha    = '${{ env.IMAGE_TAG }}'.substring(0, 7);
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[DAST] 🔴 ${high} HIGH findings on staging — ${sha}`,
              body: [
                '## 🚨 DAST Security Findings',
                '',
                '| Severity | Count |',
                '|----------|-------|',
                `| 🔴 High   | ${high}   |`,
                `| 🟡 Medium | ${medium} |`,
                `| 🟢 Low    | ${low}    |`,
                '',
                `- **Commit:** \`${sha}\``,
                `- **Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\``,
                `- **Pipeline:** [View logs](${runUrl})`,
                '',
                '## Remediation',
                '1. Download artifact `zap-report` từ pipeline run',
                '2. Review từng HIGH finding',
                '3. Fix trong code → tạo PR mới',
                '',
                '> Auto-generated by DevSecOps Pipeline'
              ].join('\n'),
              labels: ['security', 'dast', 'high-severity']
            });

      # --------------------------------------------------------
      # BƯỚC 8: Staging Gate
      # --------------------------------------------------------
      - name: Staging gate
        run: |
          HIGH=${{ steps.zap-parse.outputs.high }}
          if [[ "${HIGH}" -gt 0 ]]; then
            echo "❌ ${HIGH} HIGH findings. Blocking promotion."
            exit 1
          fi
          echo "✅ Staging gate passed."

      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          # Kill port-forward trên EC2
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "pkill -f 'kubectl port-forward' || true" || true

          # Xóa namespace staging
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "kubectl delete namespace staging --ignore-not-found=true" || true

          # Kill SSH tunnel local
          pkill -f "ssh.*18000" || true

      # Summary
      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Staging Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign verify | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy kind/EC2 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Port-forward tunnel | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST (ZAP) | ${{ steps.zap.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 High: ${{ steps.zap-parse.outputs.high }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🟡 Medium: ${{ steps.zap-parse.outputs.medium }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🟢 Low: ${{ steps.zap-parse.outputs.low }}" >> $GITHUB_STEP_SUMMARY
