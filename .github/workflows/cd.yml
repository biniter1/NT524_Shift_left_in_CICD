name: CD Pipeline

# Prerequisites / Setup Notes:
# - Push to branch `release` triggers this pipeline
# - Image ghcr.io/biniter1/nt524_shift_left_in_cicd:dev-latest must exist (built by CI)
# - Secrets required: EC2_HOST, EC2_SSH_KEY
# - EC2 must have: docker, kind, kubectl, curl
# - kind cluster named `staging` must exist on EC2
# - Repo must have: k8s/staging/{namespace,postgres,app}.yaml
#                   k8s/production/{namespace,postgres,app}.yaml
# - app.yaml must use IMAGE_PLACEHOLDER
# - GitHub Environment `production` needed for manual approval

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'dev-latest'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/biniter1/nt524_shift_left_in_cicd
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'dev-latest' }}
  REGISTRY: ghcr.io
  SECURITY_ENFORCE: "false"

jobs:
  # ═══════════════════════════════════════════════════════════
  # STEP 1 — VERIFY IMAGE từ registry
  # ═══════════════════════════════════════════════════════════

  verify:
    name: "Verify Image"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
      id-token: write
    outputs:
      passed: ${{ steps.verify_gate.outputs.passed }}
    steps:
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Technical failure — must fail if image doesn't exist
      - name: Pull image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "✅ Image pulled: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Verify signature
        id: cosign_verify
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/biniter1/.*" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "✅ Signature verified"
        continue-on-error: true

      - name: Verify SBOM attestation
        id: sbom_verify
        run: |
          COUNT=$(cosign tree \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} 2>/dev/null \
            | grep -c "Attestations" || echo "0")
          if [[ "$COUNT" -gt 0 ]]; then
            echo "✅ SBOM attestation found"
          else
            echo "⚠️ No SBOM attestation found"
            exit 1
          fi
        continue-on-error: true

      - name: Evaluate verify gate
        id: verify_gate
        run: |
          echo "## 🔍 Verify Image" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Pull | ✅ OK |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.cosign_verify.outcome }}" == "success" ]]; then
            echo "| Signature Verify | ✅ Verified |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Signature Verify | ⚠️ Not verified |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ steps.sbom_verify.outcome }}" == "success" ]]; then
            echo "| SBOM Attestation | ✅ Found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| SBOM Attestation | ⚠️ Not found |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: **SECURITY_ENFORCE=${{ env.SECURITY_ENFORCE }}**" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ env.SECURITY_ENFORCE }}" == "true" ]]; then
            if [[ "${{ steps.cosign_verify.outcome }}" == "failure" ]] || \
               [[ "${{ steps.sbom_verify.outcome }}" == "failure" ]]; then
              echo "### ❌ Verify FAILED — enforcement mode" >> $GITHUB_STEP_SUMMARY
              echo "passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            if [[ "${{ steps.cosign_verify.outcome }}" == "failure" ]] || \
               [[ "${{ steps.sbom_verify.outcome }}" == "failure" ]]; then
              echo "### ⚠️ Signature/SBOM warnings detected — allowed in verification mode" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "### ✅ Verify PASSED — continue to staging" >> $GITHUB_STEP_SUMMARY
          echo "passed=true" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════
  # STEP 2 — STAGING
  # Deploy → Smoke test → Perf test → DAST
  # ═══════════════════════════════════════════════════════════

  staging:
    name: "Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    if: needs.verify.outputs.passed == 'true'
    permissions:
      contents: read
      packages: read
      issues: write
    outputs:
      dast_high: ${{ steps.zap-parse.outputs.high }}
      dast_medium: ${{ steps.zap-parse.outputs.medium }}
      dast_low: ${{ steps.zap-parse.outputs.low }}
    steps:
      - uses: actions/checkout@v4

      # Technical failures below — SSH/deploy/test must fail the job
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy k8s manifests to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem -r k8s/staging \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s-staging

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            kind get clusters | grep -q staging \
              || { echo "❌ staging cluster not found"; exit 1; }

            kind export kubeconfig --name staging

            docker pull --platform linux/amd64 \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            kind load docker-image \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --name staging

            kubectl delete namespace staging --ignore-not-found=true
            sleep 3

            kubectl apply -f /home/ubuntu/k8s-staging/namespace.yaml
            kubectl apply -f /home/ubuntu/k8s-staging/postgres.yaml
            sed "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
              /home/ubuntu/k8s-staging/app.yaml \
              | kubectl apply -f -

            kubectl rollout status deployment/postgres \
              -n staging --timeout=120s
            kubectl rollout status deployment/restaurant-app \
              -n staging --timeout=180s

            echo "✅ Deployed to staging"
          ENDSSH

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            kind export kubeconfig --name staging

            pkill -f "kubectl port-forward.*18000" || true
            sleep 2

            nohup kubectl port-forward svc/restaurant-app 18000:8000 \
              -n staging > /tmp/pf-staging.log 2>&1 &
            sleep 8

            for i in $(seq 1 10); do
              if curl -sf http://localhost:18000/docs > /dev/null; then
                echo "✅ Smoke test passed"
                break
              fi
              [[ $i -eq 10 ]] && {
                echo "❌ App unhealthy after smoke test"
                cat /tmp/pf-staging.log
                exit 1
              }
              sleep 5
            done
          ENDSSH

      - name: Performance test
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            kind export kubeconfig --name staging

            echo "Running basic load test (100 requests)..."
            SUCCESS=0
            FAIL=0
            for i in $(seq 1 100); do
              if curl -sf http://localhost:18000/docs > /dev/null; then
                SUCCESS=$((SUCCESS + 1))
              else
                FAIL=$((FAIL + 1))
              fi
            done

            echo "Success: ${SUCCESS}/100, Failed: ${FAIL}/100"
            ERROR_RATE=$((FAIL * 100 / 100))

            if [[ "$ERROR_RATE" -gt 10 ]]; then
              echo "❌ Error rate ${ERROR_RATE}% exceeds 10% threshold"
              exit 1
            fi
            echo "✅ Performance test passed"
          ENDSSH

      - name: Expose app for DAST
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "nohup kubectl port-forward svc/restaurant-app 18000:8000 \
             -n staging --address 0.0.0.0 > /tmp/pf-dast.log 2>&1 &"

          ssh -i ~/.ssh/ec2_key.pem \
            -L 8000:localhost:18000 \
            -N -f \
            ubuntu@${{ secrets.EC2_HOST }}
          sleep 8

          curl -sf http://localhost:8000/docs \
            && echo "✅ Tunnel ready" \
            || { echo "❌ DAST tunnel failed"; exit 1; }

      # DAST — security finding, not a technical failure
      - name: DAST — OWASP ZAP
        id: zap
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
          artifact_name: zap-report
        continue-on-error: true

      - name: Parse ZAP results
        id: zap-parse
        if: always()
        run: |
          if [ -f "report_json.json" ]; then
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' \
              report_json.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' \
              report_json.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' \
              report_json.json 2>/dev/null || echo "0")
          else
            HIGH=0
            MEDIUM=0
            LOW=0
          fi
          echo "high=${HIGH}" >> $GITHUB_OUTPUT
          echo "medium=${MEDIUM}" >> $GITHUB_OUTPUT
          echo "low=${LOW}" >> $GITHUB_OUTPUT
          echo "DAST — High:${HIGH} Medium:${MEDIUM} Low:${LOW}"

      # Create issue only when HIGH > 0, but never block pipeline
      - name: Create issue for HIGH findings
        if: always() && steps.zap-parse.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DAST] 🔴 ${{ steps.zap-parse.outputs.high }} HIGH findings`,
              body: [
                '## DAST Findings',
                '| Severity | Count |',
                '|----------|-------|',
                `| 🔴 High   | ${{ steps.zap-parse.outputs.high }} |`,
                `| 🟡 Medium | ${{ steps.zap-parse.outputs.medium }} |`,
                `| 🟢 Low    | ${{ steps.zap-parse.outputs.low }} |`,
                `\n**Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\``,
                `\n**Mode:** SECURITY_ENFORCE=${{ env.SECURITY_ENFORCE }}`,
              ].join('\n'),
              labels: ['security', 'dast']
            });
        continue-on-error: true

      - name: Write Staging summary
        if: always()
        run: |
          echo "## 🚀 Staging Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ steps.zap.outcome != '' && '✅ OK' || '⚠️ check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST High   | **${{ steps.zap-parse.outputs.high || 0 }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST Medium | **${{ steps.zap-parse.outputs.medium || 0 }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST Low    | **${{ steps.zap-parse.outputs.low || 0 }}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: **SECURITY_ENFORCE=${{ env.SECURITY_ENFORCE }}**" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ env.SECURITY_ENFORCE }}" == "false" ]]; then
            echo "- ⚠️ DAST findings are collected but not blocking in verification mode" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup staging
        if: always()
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "pkill -f 'kubectl port-forward.*18000' || true" || true
          pkill -f "ssh.*18000" || true

  # ═══════════════════════════════════════════════════════════
  # GATE STAGING
  # ═══════════════════════════════════════════════════════════

  gate-staging:
    name: "Gate Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [staging]
    if: always()
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - name: Evaluate gate
        id: gate
        run: |
          echo "## 🚦 Gate Staging" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          BLOCK=0
          HIGH="${{ needs.staging.outputs.dast_high }}"

          if [[ "${{ needs.staging.result }}" == "failure" ]]; then
            echo "| Staging Deploy & Test | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
            BLOCK=$((BLOCK + 1))
          else
            echo "| Staging Deploy & Test | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| DAST High findings | **${HIGH:-0}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: **SECURITY_ENFORCE=${{ env.SECURITY_ENFORCE }}**" >> $GITHUB_STEP_SUMMARY

          # Technical failure: staging deploy/test failed → always block
          if [[ "$BLOCK" -gt 0 ]]; then
            echo "### ❌ Gate FAILED — staging deploy/test failed (technical failure)" >> $GITHUB_STEP_SUMMARY
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Security finding: DAST HIGH
          if [[ "${HIGH:-0}" -gt 0 ]]; then
            if [[ "${{ env.SECURITY_ENFORCE }}" == "true" ]]; then
              echo "### ❌ Gate FAILED — DAST HIGH findings block production (enforcement mode)" >> $GITHUB_STEP_SUMMARY
              echo "passed=false" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "### ⚠️ DAST HIGH findings detected but allowed in verification mode" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "### ✅ Gate PASSED — continue to manual approve → production" >> $GITHUB_STEP_SUMMARY
          echo "passed=true" >> $GITHUB_OUTPUT
          exit 0

  # ═══════════════════════════════════════════════════════════
  # MANUAL APPROVE
  # Setup GitHub Environment "production" with required reviewers
  # for real manual approval gate
  # ═══════════════════════════════════════════════════════════

  approve:
    name: "Manual Approve"
    runs-on: ubuntu-latest
    needs: [gate-staging]
    if: needs.gate-staging.outputs.passed == 'true'
    environment:
      name: production
    steps:
      - name: Approved
        run: echo "✅ Production deployment approved"

  # ═══════════════════════════════════════════════════════════
  # PRODUCTION — Canary deploy (simulate)
  # Technical failures must fail this job — no soft wrapping
  # ═══════════════════════════════════════════════════════════

  production:
    name: "Production Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [approve, gate-staging]
    if: needs.gate-staging.outputs.passed == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy k8s manifests to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/k8s-production"
          scp -i ~/.ssh/ec2_key.pem -r k8s/production/*.yaml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s-production/

      - name: Deploy production (Canary simulate)
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            kind get clusters | grep -q staging \
              || { echo "❌ cluster not found"; exit 1; }

            kind export kubeconfig --name staging

            docker pull --platform linux/amd64 \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            kind load docker-image \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              --name staging

            kubectl apply -f /home/ubuntu/k8s-production/namespace.yaml
            kubectl apply -f /home/ubuntu/k8s-production/postgres.yaml

            sed "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
              /home/ubuntu/k8s-production/app.yaml \
              | kubectl apply -f -

            kubectl rollout status deployment/postgres \
              -n production --timeout=120s
            kubectl rollout status deployment/restaurant-app \
              -n production --timeout=180s

            # Canary simulate: 1 replica → 2 → 3
            echo "Canary 5% → 50% → 100%..."
            kubectl scale deployment/restaurant-app --replicas=1 -n production
            sleep 5
            kubectl scale deployment/restaurant-app --replicas=2 -n production
            sleep 5
            kubectl scale deployment/restaurant-app --replicas=3 -n production

            echo "✅ Production deployed"
          ENDSSH

      - name: Production smoke test
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            kind export kubeconfig --name staging

            pkill -f "kubectl port-forward.*18001" || true
            sleep 2

            nohup kubectl port-forward svc/restaurant-app 18001:8000 \
              -n production > /tmp/pf-prod.log 2>&1 &
            sleep 8

            for i in $(seq 1 12); do
              if curl -sf http://localhost:18001/docs > /dev/null; then
                echo "✅ Production healthy"
                break
              fi
              [[ $i -eq 12 ]] && {
                echo "❌ Production unhealthy — initiating rollback"
                kubectl rollout undo deployment/restaurant-app -n production
                exit 1
              }
              sleep 5
            done

            pkill -f "kubectl port-forward.*18001" || true
          ENDSSH

  # ═══════════════════════════════════════════════════════════
  # OBSERVABILITY
  # ═══════════════════════════════════════════════════════════

  observability:
    name: "Observability"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [production]
    if: needs.production.result == 'success'
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Check Falco
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            if command -v falco &>/dev/null; then
              echo "✅ Falco installed"
              sudo systemctl status falco --no-pager | head -5 || true
            else
              echo "⚠️ Falco not installed — skipped in verification mode"
              echo "   To enable runtime security, install Falco on EC2 manually."
            fi
          ENDSSH
        continue-on-error: true

      - name: Production health check
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'ENDSSH'
            kind export kubeconfig --name staging
            echo "=== Production Pods ==="
            kubectl get pods -n production
            echo "=== Production Services ==="
            kubectl get svc -n production
            echo "✅ Observability check complete"
          ENDSSH

      - name: Write Observability summary
        if: always()
        run: |
          echo "## 👁️ Observability" >> $GITHUB_STEP_SUMMARY
          echo "- Production pod/service inventory collected" >> $GITHUB_STEP_SUMMARY
          echo "- Falco: checked (skipped if not installed in verification mode)" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # AUDIT
  # ═══════════════════════════════════════════════════════════

  audit:
    name: "Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, staging, gate-staging, production, observability]
    if: always()
    steps:
      - name: CD Summary
        run: |
          echo "## 🚀 CD Pipeline Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verify Image   | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging        | ${{ needs.staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate Staging   | ${{ needs.gate-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production     | ${{ needs.production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Observability  | ${{ needs.observability.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DAST Findings (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 High   | ${{ needs.staging.outputs.dast_high || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | ${{ needs.staging.outputs.dast_medium || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low    | ${{ needs.staging.outputs.dast_low || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mode" >> $GITHUB_STEP_SUMMARY
          echo "- **SECURITY_ENFORCE:** \`${{ env.SECURITY_ENFORCE }}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ env.SECURITY_ENFORCE }}" == "false" ]]; then
            echo "- ⚠️ **Note:** Security findings are collected but not blocking in verification mode." >> $GITHUB_STEP_SUMMARY
            echo "- To enable enforcement, set \`SECURITY_ENFORCE: \"true\"\` in the workflow env." >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🔒 Enforcement mode active — security gates are blocking." >> $GITHUB_STEP_SUMMARY
          fi
